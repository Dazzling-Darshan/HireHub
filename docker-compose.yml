services:
  # ==========================================
  # Database Service (MongoDB)
  # ==========================================
  mongodb:
    image: mongo:7.0
    container_name: hirehub-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - hirehub-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================
  # Cache Service (Redis)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: hirehub-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - hirehub-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ==========================================
  # Backend API Service
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: hirehub-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017/portal}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkey_change_in_production_12345}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173,http://localhost:80}
      CLOUD_NAME: ${CLOUD_NAME:-}
      API_KEY: ${API_KEY:-}
      API_SECRET: ${API_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hirehub-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ==========================================
  # Frontend Service (React + Nginx)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hirehub-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - hirehub-network

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  hirehub-network:
    driver: bridge
